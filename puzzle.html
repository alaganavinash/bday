<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Are You Today?</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Parisienne&family=Satisfy&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<canvas id="petals"></canvas>

<main class="puzzle" id="puzzleMain">
  <div class="puzzle__card">
    <h1 class="puzzle__title" id="puzzleQuestion">How are you today?</h1>
    <button class="btn-celebrate" id="whyBtn" type="button">Why?</button>
  </div>
</main>

<div class="puzzle__success" id="puzzleSuccess" hidden>
  <p class="puzzle__success-label" id="successIntro"></p>
  <div class="puzzle__success-number" id="successAnswer"></div>
  <p class="puzzle__success-days" id="successDays"></p>
</div>

<script src="js/config.js"></script>
<script src="js/effects.js"></script>
<script src="js/puzzle.js"></script>
</body>
</html>
