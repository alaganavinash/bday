<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<canvas id="petals"></canvas>

<header class="hero">
  <nav class="nav">
    <span class="nav__brand">a little celebration</span>
  </nav>

  <div class="hero__content">
    <p class="hero__eyebrow">counting down to</p>
    <h1 class="hero__name" id="heroName">Someone Wonderful</h1>
    <p class="hero__tagline" id="heroTagline">A small corner of the internet, made just for you.</p>

    <div class="countdown" id="countdown">
      <div class="countdown__unit">
        <span class="countdown__num" id="cd-days">00</span>
        <span class="countdown__label">days</span>
      </div>
      <div class="countdown__unit">
        <span class="countdown__num" id="cd-hours">00</span>
        <span class="countdown__label">hours</span>
      </div>
      <div class="countdown__unit">
        <span class="countdown__num" id="cd-mins">00</span>
        <span class="countdown__label">mins</span>
      </div>
      <div class="countdown__unit">
        <span class="countdown__num" id="cd-secs">00</span>
        <span class="countdown__label">secs</span>
      </div>
    </div>
    <p class="countdown__arrived" id="arrivedText" hidden>It's finally here. Happy birthday! 🎉</p>

    <button class="btn-celebrate" id="celebrateBtn">Celebrate ✨</button>
  </div>

  <a class="scroll-hint" href="#letter">
    <span></span>
  </a>
</header>

<main>
  <section class="letter" id="letter">
    <div class="letter__card">
      <p class="letter__kicker">a letter for you</p>
      <p class="letter__body" id="letterBody"></p>
      <p class="letter__sign" id="letterSign"></p>
    </div>
  </section>
</main>

<footer class="footer">
  <p>With care, somewhere between a browser tab and a heart.</p>
</footer>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
